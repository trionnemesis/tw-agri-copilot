name: Fixture CI
on:
  push:
  pull_request:
  # Pushes made by the daily update use GITHUB_TOKEN, which never starts a workflow run, so main
  # is also checked on a schedule instead of only when a human pushes.
  schedule:
    - cron: '40 22 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps --only-shell chromium
      - run: PYTHONPATH=src python3 -m compileall -q src tests
      - run: PYTHONPATH=src python3 -m tpw validate-config
      - run: PYTHONPATH=src python3 -m tpw validate-market-calendar --year 2026
      - run: PYTHONPATH=src python3 -m tpw validate-agent-run tests/fixtures/agent-run.valid.json
      - name: Validate the committed publication before fixtures replace it
        # seed-prototype rewrites data/ and the later rebuild rewrites site/, so every check after
        # this point sees the August fixture. On the scheduled run this is the only step that looks
        # at what main actually publishes.
        run: |
          PYTHONPATH=src python3 -m tpw verify-site
          PYTHONPATH=src python3 -m tpw validate-data --as-of "$(python3 -c 'import json, pathlib; print(json.loads(pathlib.Path("site/data/current.json").read_text(encoding="utf-8"))["as_of_date"])')"
      - run: PYTHONPATH=src python3 -m tpw seed-prototype --as-of 2026-08-25
      - run: PYTHONPATH=src python3 -m tpw validate-source-run --date 2026-08-25
      - name: Run the test suite and prove it leaves the publication untouched
        # The preceding seed-prototype step deliberately writes fixture content, so compare either
        # side of the suite rather than requiring a clean tree. Compare content hashes, not
        # `git status --porcelain`: that reports only status codes and pathnames, so a test
        # overwriting a file seed-prototype already modified would slip through unnoticed.
        run: |
          publication_signature() { find data reports site -type f -exec sha256sum {} + | sort | sha256sum; }
          before="$(publication_signature)"
          PYTHONPATH=src python3 -m unittest discover -s tests -t . -v
          if [ "$before" != "$(publication_signature)" ]; then
            git status --porcelain
            echo '::error::the test suite changed data/, reports/ or site/; tests must not write to them'
            exit 1
          fi
      - name: Rebuild the committed prototype fixture
        run: |
          PYTHONPATH=src python3 -m tpw seed-prototype --as-of 2026-08-25
          PYTHONPATH=src python3 -m tpw build --as-of 2026-08-25
          PYTHONPATH=src python3 -m tpw.presentation
          PYTHONPATH=src python3 -m tpw validate-traceability
          PYTHONPATH=src python3 -m tpw validate-traceability-events
          PYTHONPATH=src python3 -m tpw validate-data --as-of 2026-08-25
          PYTHONPATH=src python3 -m tpw verify-site --as-of 2026-08-25
      - run: npm run test:browser
      - run: test "$(du -sm site | cut -f1)" -le 900
      - run: test "$(du -sm --exclude=.git . | cut -f1)" -le 900
      - run: '! rg -n ''AKIA|ghp_|glpat-|github_pat_|BEGIN PRIVATE KEY|base64,'' site'
