name: Fixture CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: PYTHONPATH=src python3 -m compileall -q src tests
      - run: PYTHONPATH=src python3 -m tpw validate-config
      - run: PYTHONPATH=src python3 -m tpw seed-prototype --as-of 2026-08-25
      - run: PYTHONPATH=src python3 -m unittest discover -s tests -t . -v
      - name: Rebuild the committed prototype fixture
        run: |
          PYTHONPATH=src python3 -m tpw seed-prototype --as-of 2026-08-25
          PYTHONPATH=src python3 -m tpw build --as-of 2026-08-25
          PYTHONPATH=src python3 -m tpw validate-data --as-of 2026-08-25
          PYTHONPATH=src python3 -m tpw verify-site --as-of 2026-08-25
      - run: test "$(du -sm site | cut -f1)" -le 900
      - run: test "$(du -sm --exclude=.git . | cut -f1)" -le 900
      - run: '! rg -n ''AKIA|ghp_|glpat-|github_pat_|BEGIN PRIVATE KEY|base64,'' site'
