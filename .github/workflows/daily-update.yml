name: Daily market update
# Scheduled runs publish the latest complete watchlist date when today's feed is not complete yet.
on:
  schedule:
    - cron: '0 9,18 * * *'
      timezone: 'Asia/Taipei'
  push:
    branches: [main]
    paths:
      - 'src/tpw/**'
      - 'config/**'
      - '.github/workflows/daily-update.yml'
  workflow_dispatch:
    inputs:
      as_of_date: {required: false, type: string}
      backfill_days: {required: false, type: string}
      force_seasonality_refresh:
        description: Bypass a reusable same-month live seasonality snapshot
        required: false
        type: boolean
        default: false
concurrency: {group: taiwan-produce-daily-update, cancel-in-progress: false}
jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: PYTHONPATH=src python3 -m tpw validate-config
      - run: PYTHONPATH=src python3 -m tpw validate-market-calendar --year 2026
      - id: dates
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_DATE: ${{ inputs.as_of_date }}
        run: |
          allow_fallback=false
          if [ "$EVENT_NAME" = 'push' ]; then
            requested="$(python3 -c 'import json, pathlib; print(json.loads(pathlib.Path("site/data/current.json").read_text(encoding="utf-8"))["as_of_date"])')"
          else
            requested="$REQUESTED_DATE"
            if [ -z "$requested" ]; then
              requested="$(TZ=Asia/Taipei date +%F)"
              allow_fallback=true
            fi
            if [ "$EVENT_NAME" = 'schedule' ]; then
              allow_fallback=true
            fi
          fi
          if ! [[ "$requested" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo 'as_of_date must use YYYY-MM-DD' >&2
            exit 2
          fi
          echo "requested=$requested" >> "$GITHUB_OUTPUT"
          echo "allow_fallback=$allow_fallback" >> "$GITHUB_OUTPUT"
      - id: market_refresh
        name: Fetch bounded rolling windows
        if: github.event_name != 'push'
        env:
          AS_OF_DATE: ${{ steps.dates.outputs.requested }}
          ALLOW_FALLBACK: ${{ steps.dates.outputs.allow_fallback }}
          BACKFILL_DAYS: ${{ inputs.backfill_days || '4' }}
        run: |
          if ! [[ "$BACKFILL_DAYS" =~ ^[0-9]+$ ]] || [ "$BACKFILL_DAYS" -lt 1 ] || [ "$BACKFILL_DAYS" -gt 120 ]; then
            echo 'backfill_days must be an integer from 1 to 120' >&2
            exit 2
          fi
          set +e
          refresh_output="$(PYTHONPATH=src python3 -m tpw backfill --days "$BACKFILL_DAYS" --end "$AS_OF_DATE" 2>&1)"
          refresh_status=$?
          set -e
          printf '%s\n' "$refresh_output"
          if [ "$refresh_status" -ne 0 ]; then
            if [ "$ALLOW_FALLBACK" = 'true' ] && grep -q 'UpstreamUnavailable' <<<"$refresh_output"; then
              set +e
              probe_output="$(PYTHONPATH=src python3 -m tpw fetch-market --start "$AS_OF_DATE" --end "$AS_OF_DATE" 2>&1)"
              probe_status=$?
              set -e
              printf '%s\n' "$probe_output"
              if [ "$probe_status" -eq 0 ]; then
                echo "status=success" >> "$GITHUB_OUTPUT"
                echo "::notice::Rolling refresh was unavailable; the bounded single-day probe recorded today's market status."
                echo "Market refresh: single-day status probe succeeded." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              PYTHONPATH=src python3 -m tpw record-market-status --requested-date "$AS_OF_DATE" --status source_unavailable
              echo "status=degraded" >> "$GITHUB_OUTPUT"
              echo "::warning::MOA market refresh failed after retries; publishing the latest complete committed market date instead."
              echo "Market refresh: degraded; using last complete committed data." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            exit "$refresh_status"
          fi
          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "Market refresh: success." >> "$GITHUB_STEP_SUMMARY"
      - id: resolved
        name: Resolve publishable market date
        env:
          REQUESTED_DATE: ${{ steps.dates.outputs.requested }}
          ALLOW_FALLBACK: ${{ steps.dates.outputs.allow_fallback }}
        run: |
          resolved="$REQUESTED_DATE"
          if [ "$ALLOW_FALLBACK" = 'true' ]; then
            resolved="$(PYTHONPATH=src python3 -m tpw.schedule --on-or-before "$REQUESTED_DATE")"
          fi
          echo "date=$resolved" >> "$GITHUB_OUTPUT"
          echo "month=${REQUESTED_DATE:0:7}" >> "$GITHUB_OUTPUT"
          echo "Requested market date: $REQUESTED_DATE" >> "$GITHUB_STEP_SUMMARY"
          echo "Resolved market date: $resolved" >> "$GITHUB_STEP_SUMMARY"
          if [ "$resolved" != "$REQUESTED_DATE" ]; then
            echo "::notice::Latest complete market date is $resolved; requested $REQUESTED_DATE is not complete yet."
          fi
      - name: Refresh supplemental context
        if: github.event_name != 'push'
        env:
          AS_OF_MONTH: ${{ steps.resolved.outputs.month }}
          AS_OF_DATE: ${{ steps.dates.outputs.requested }}
          FORCE_SEASONALITY_REFRESH: ${{ inputs.force_seasonality_refresh || false }}
        run: |
          seasonality_args=(--month "$AS_OF_MONTH")
          if [ "$FORCE_SEASONALITY_REFRESH" = 'true' ]; then
            seasonality_args+=(--force)
          fi
          seasonality_output="$(PYTHONPATH=src python3 -m tpw refresh-seasonality "${seasonality_args[@]}")"
          printf '%s\n' "$seasonality_output"
          echo "$seasonality_output" >> "$GITHUB_STEP_SUMMARY"
          PYTHONPATH=src python3 -m tpw fetch-traceability --as-of "$AS_OF_DATE"
      - name: Build, normalize, and validate
        env:
          AS_OF_DATE: ${{ steps.resolved.outputs.date }}
        run: |
          PYTHONPATH=src python3 -m tpw build --as-of "$AS_OF_DATE"
          PYTHONPATH=src python3 -m tpw.presentation
          PYTHONPATH=src python3 -m tpw validate-data --as-of "$AS_OF_DATE"
          PYTHONPATH=src python3 -m tpw verify-site --as-of "$AS_OF_DATE"
      - name: Commit changed content to main
        run: |
          git add data reports site
          if git diff --cached --quiet; then
            echo 'No content changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: daily market update'
          git push origin HEAD:main

  deploy:
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: PYTHONPATH=src python3 -m tpw verify-site
      - run: test "$(du -sm site | cut -f1)" -le 900
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
