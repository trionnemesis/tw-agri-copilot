name: Daily market update
on:
  schedule:
    - cron: '0 2,5 * * *'
      timezone: 'Asia/Taipei'
  workflow_dispatch:
    inputs:
      as_of_date: {required: false, type: string}
      backfill_days: {required: false, type: string}
concurrency: {group: taiwan-produce-daily-update, cancel-in-progress: false}
jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: PYTHONPATH=src python3 -m tpw validate-config
      - id: dates
        env:
          REQUESTED_DATE: ${{ inputs.as_of_date }}
        run: |
          requested="$REQUESTED_DATE"
          if [ -z "$requested" ]; then
            requested="$(TZ=Asia/Taipei date +%F)"
          fi
          if ! [[ "$requested" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo 'as_of_date must use YYYY-MM-DD' >&2
            exit 2
          fi
          echo "end=$requested" >> "$GITHUB_OUTPUT"
          echo "month=${requested:0:7}" >> "$GITHUB_OUTPUT"
      - name: Fetch bounded rolling windows
        env:
          AS_OF_DATE: ${{ steps.dates.outputs.end }}
          BACKFILL_DAYS: ${{ inputs.backfill_days || '4' }}
        run: |
          if ! [[ "$BACKFILL_DAYS" =~ ^[0-9]+$ ]] || [ "$BACKFILL_DAYS" -lt 1 ] || [ "$BACKFILL_DAYS" -gt 120 ]; then
            echo 'backfill_days must be an integer from 1 to 120' >&2
            exit 2
          fi
          PYTHONPATH=src python3 -m tpw backfill --days "$BACKFILL_DAYS" --end "$AS_OF_DATE"
      - name: Build and validate
        env:
          AS_OF_DATE: ${{ steps.dates.outputs.end }}
          AS_OF_MONTH: ${{ steps.dates.outputs.month }}
        run: |
          PYTHONPATH=src python3 -m tpw fetch-seasonality --month "$AS_OF_MONTH"
          PYTHONPATH=src python3 -m tpw fetch-traceability --month "$AS_OF_MONTH"
          PYTHONPATH=src python3 -m tpw build --as-of "$AS_OF_DATE"
          PYTHONPATH=src python3 -m tpw validate-data --as-of "$AS_OF_DATE"
          PYTHONPATH=src python3 -m tpw verify-site --as-of "$AS_OF_DATE"
      - name: Commit changed content to main
        run: |
          git add data reports site
          if git diff --cached --quiet; then
            echo 'No content changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: daily market update'
          git push origin HEAD:main

  deploy:
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: PYTHONPATH=src python3 -m tpw verify-site
      - run: test "$(du -sm site | cut -f1)" -le 900
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: {path: site}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
